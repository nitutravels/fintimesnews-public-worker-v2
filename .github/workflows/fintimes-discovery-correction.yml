name: Remove internal discovery labels
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fintimes-public-publishing
  cancel-in-progress: false
jobs:
  correct-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth
      - name: Correct existing metadata and verify readback
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python tools/yt_discovery_correction.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-corrections
          path: output/
          retention-days: 30
