name: FinTimes verified long editions and fresh X Shorts
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish if all evidence, model and daily-limit checks pass
        type: boolean
        default: true
      mode:
        description: Verified long edition or fresh X Shorts
        type: choice
        options: [long, short]
        default: short
  schedule:
    # IST: 08:00, 12:30, 16:30, 20:30. Shorts are also dispatched after capture.
    - cron: '30 2 * * *'
    - cron: '0 7,11,15 * * *'
    - cron: '25 * * * *'
permissions:
  contents: read
concurrency:
  group: fintimes-public-publishing
  cancel-in-progress: false
jobs:
  release-owner-approved-pilot:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Publish owner-authorized FinTimes pilot' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nitutravels/fintimesnews-automation
          ref: e5013300d0f92dcad5741647ce3ba942e85e5fd4
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth Pillow
      - name: Publish the existing pilot and confirm public visibility
        working-directory: private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m fintimes_v4.public_release L6fbRY9ScC8
      - name: Record public release receipt
        uses: actions/upload-artifact@v4
        with:
          name: fintimes-v42-public-release
          path: private/output/public_release.json
          retention-days: 30
      - name: Check authorized X configuration without consuming paid reads
        if: always()
        env:
          X_COLLECTION_BACKEND: twscrape
          X_SCRAPER_COOKIES: ${{ secrets.X_SCRAPER_COOKIES }}
          X_SCRAPER_HEALTH_PATH: x-state/health.json
          TWS_TELEMETRY: '0'
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_AUTHORIZED_FEED_URL: ${{ secrets.X_AUTHORIZED_FEED_URL }}
          X_FREE_READ_ENTITLEMENT: ${{ vars.X_FREE_READ_ENTITLEMENT }}
          X_PROVIDER_ZERO_COST_CONFIRMED: ${{ vars.X_PROVIDER_ZERO_COST_CONFIRMED }}
        run: |
          python - <<'PY'
          import os,json
          print(json.dumps({'x_bearer_configured':bool(os.getenv('X_BEARER_TOKEN')),'authorized_feed_configured':bool(os.getenv('X_AUTHORIZED_FEED_URL')),'paid_reads_attempted':False}))
          PY
      - if: always()
        run: rm -rf private
  automatic-newsroom:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: fintimes-x-owner-session
      cancel-in-progress: false
    env:
      DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.publish) }}
      PIP_NO_CACHE_DIR: '1'
      EDITION_MODE: ${{ github.event_name == 'schedule' && github.event.schedule != '25 * * * *' && 'long' || inputs.mode || 'short' }}
      FINTIMES_DURABLE_JOURNAL: '1'
      GH_TOKEN: ${{ secrets.FINTIMES_JOURNAL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nitutravels/fintimesnews-automation
          ref: e5013300d0f92dcad5741647ce3ba942e85e5fd4
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - name: Check out latest private GemSearch inbox
        uses: actions/checkout@v4
        with:
          repository: nitutravels/fintimesnews-automation
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: gemsearch-intake
          sparse-checkout: inbox
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication quota dependencies
        run: python -m pip install google-api-python-client google-auth Pillow
      - name: Restore publication journal cache
        uses: actions/cache/restore@v4
        with:
          path: private/state
          key: fintimes-v45-publication-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fintimes-v45-publication-state-
            fintimes-v42-publication-state-
      - name: Restore durable publication journal and check lane quota
        id: quota
        working-directory: private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m fintimes_v4.journal_sync pull
          python - <<'PY'
          import os,json,pathlib
          from fintimes_v4.edition_policy import public_counts_today,long_slot
          from fintimes_v4.newsroom import connect
          from fintimes_v4.public_release import youtube_client
          counts=public_counts_today(youtube_client())
          policy=json.loads(pathlib.Path('config/production.json').read_text())
          mode=os.environ['EDITION_MODE'];dry=os.getenv('DRY_RUN')=='true'
          can_run=dry or policy.get('public_publishing_enabled',False)
          reason='ready'
          with connect('state/newsroom.sqlite3') as db:
              if not dry and db.execute("SELECT 1 FROM publications WHERE state IN ('uploading','processing','private-uploaded','needs-reconciliation') LIMIT 1").fetchone():
                  can_run=False;reason='publication_needs_reconciliation'
              if not dry and mode=='long':
                  slot=long_slot(slots=policy['long_publication_slots_ist'])
                  if slot is None or db.execute('SELECT 1 FROM edition_slots WHERE slot=?',(slot,)).fetchone() or counts['long']>=policy['max_long_publications_per_ist_day']:
                      can_run=False;reason='long_slot_or_daily_quota'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('can_run='+str(can_run).lower()+'\n')
          pathlib.Path('output').mkdir(exist_ok=True)
          receipt={'public_videos_today':counts,'can_run':can_run,'mode':mode,'dry_run':dry,'reason':reason}
          pathlib.Path('output/quota.json').write_text(json.dumps(receipt))
          print(json.dumps(receipt))
          PY
      - name: Restore immutable public model checkpoint
        if: steps.quota.outputs.can_run == 'true'
        uses: actions/cache@v4
        with:
          path: private/model_research/minicpm-thinking
          key: minicpm-v46-thinking-93d8f4b60ad5d1f763442cf4c19f2a71fa95af4a
      - name: Restore sanitized X cooldown
        uses: actions/cache@v4
        with:
          path: private/x-state
          key: fintimes-x-health-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fintimes-x-health-
      - name: Install CPU newsroom and local voice
        if: steps.quota.outputs.can_run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r private/requirements-editor.txt -r private/requirements-v4.txt -r private/requirements-x.txt
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/fintimes-voice" en_US-ljspeech-high
      - name: Test publication lanes and source controls
        if: steps.quota.outputs.can_run == 'true'
        working-directory: private
        run: python -m unittest discover -s tests -v
      - name: Restore trained adapter and immutable base
        if: steps.quota.outputs.can_run == 'true'
        working-directory: private
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m fintimes_v4.restore_adapter
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('openbmb/MiniCPM-V-4.6-Thinking',revision='93d8f4b60ad5d1f763442cf4c19f2a71fa95af4a',allow_patterns=['*.json','*.jinja','*.safetensors'],local_dir='model_research/minicpm-thinking')
          PY
      - name: Research, automatically review, render and publish eligible news
        if: steps.quota.outputs.can_run == 'true'
        working-directory: private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMSEARCH_INBOX_JSON: ${{ github.workspace }}/gemsearch-intake/inbox/gemsearch-latest.json
          X_COLLECTION_BACKEND: twscrape
          X_SCRAPER_COOKIES: ${{ secrets.X_SCRAPER_COOKIES }}
          X_SCRAPER_HEALTH_PATH: x-state/health.json
          TWS_TELEMETRY: '0'
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_AUTHORIZED_FEED_URL: ${{ secrets.X_AUTHORIZED_FEED_URL }}
          X_FREE_READ_ENTITLEMENT: ${{ vars.X_FREE_READ_ENTITLEMENT }}
          X_PROVIDER_ZERO_COST_CONFIRMED: ${{ vars.X_PROVIDER_ZERO_COST_CONFIRMED }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python -m fintimes_v4.auto_pipeline --model model_research/minicpm-thinking --adapter models/editor --voice "$RUNNER_TEMP/fintimes-voice/en_US-ljspeech-high.onnx" --mode "$EDITION_MODE" --max-batch 3
          else
            python -m fintimes_v4.auto_pipeline --model model_research/minicpm-thinking --adapter models/editor --voice "$RUNNER_TEMP/fintimes-voice/en_US-ljspeech-high.onnx" --mode "$EDITION_MODE" --max-batch 3 --publish
          fi
      - name: Retain only publication state
        if: always()
        working-directory: private
        run: |
          python - <<'PY'
          import pathlib,sqlite3
          p=pathlib.Path('state/newsroom.sqlite3')
          if p.exists():
              db=sqlite3.connect(p)
              for t in ['candidates','feed_health']:
                  try:db.execute('DELETE FROM '+t)
                  except sqlite3.OperationalError:pass
              db.commit();db.execute('VACUUM');db.close()
          PY
      - name: Persist publication journal even after an interrupted run
        if: always()
        working-directory: private
        run: |
          if [ -f state/newsroom.sqlite3 ]; then
            python -m fintimes_v4.journal_sync push
          fi
      - name: Save publication journal cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: private/state
          key: fintimes-v45-publication-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save operational receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintimes-v42-receipts-${{ github.run_id }}
          path: |
            private/output/quota.json
            private/output/automatic/**/run_report.json
            private/output/automatic/batch_report.json
            private/output/automatic/**/youtube_result.json
            private/output/automatic/**/public_release.json
            private/state/newsroom.sqlite3
          retention-days: 14
          if-no-files-found: warn
      - name: Save reviewed draft videos when publication was not requested
        if: success() && env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fintimes-reviewed-video-drafts-${{ github.run_id }}
          path: |
            private/output/automatic/**/*.mp4
            private/output/automatic/**/thumbnail.jpg
            private/output/automatic/**/description.txt
            private/output/automatic/**/captions.srt
            private/output/automatic/**/qc.json
          retention-days: 2
          if-no-files-found: ignore
      - name: Remove temporary private source and narration
        if: always()
        run: |
          rm -rf private/fintimes_v4 private/stories private/models private/output
          rm -rf "$RUNNER_TEMP/fintimes-voice"
          rm -rf gemsearch-intake

