name: FinTimes hourly X and official research
on:
  push:
    branches: [main, fintimes-v4-private-pilot]
    paths: ['.github/workflows/fintimes-v4-private-pilot.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fintimes-v4-private-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.event_name == 'push' && github.run_attempt == 1 && github.event.head_commit.message == 'Run FinTimes v4 private pilot and hourly research collection'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed private source
        uses: actions/checkout@v4
        with:
          repository: nitutravels/fintimesnews-automation
          ref: f710bf71f3f04df14926f73553e56b10d4b239e2
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r private/requirements-v4.txt
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/fintimes-v4-voices" en_US-ljspeech-high
      - name: Check editorial controls
        working-directory: private
        run: python -m unittest discover -s tests -p test_fintimes_v4.py -v
      - name: Render original Short
        working-directory: private
        run: python -m fintimes_v4.render stories/v4/pilot-us-jobs.json --model "$RUNNER_TEMP/fintimes-v4-voices/en_US-ljspeech-high.onnx" --output output/pilot
      - name: Upload private pilot to the verified FinTimes channel
        working-directory: private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m fintimes_v4.publish stories/v4/pilot-us-jobs.json --output output/pilot --db newsroom.sqlite3
      - name: Record receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintimes-v4-private-pilot-receipt
          path: |
            private/output/pilot/youtube_result.json
            private/output/pilot/qc.json
            private/newsroom.sqlite3
          retention-days: 7
          if-no-files-found: warn
      - name: Remove temporary private production files
        if: always()
        run: |
          rm -rf private
          rm -rf "$RUNNER_TEMP/fintimes-v4-voices"
  newsroom:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: fintimes-x-owner-session
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nitutravels/fintimesnews-automation
          ref: f710bf71f3f04df14926f73553e56b10d4b239e2
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - name: Check out latest private GemSearch inbox
        uses: actions/checkout@v4
        with:
          repository: nitutravels/fintimesnews-automation
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: gemsearch-intake
          sparse-checkout: inbox
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned GitHub X scraper
        run: python -m pip install -r private/requirements-x.txt Pillow==13.0.0
      - name: Test X collection and editorial controls
        working-directory: private
        run: python -m unittest discover -s tests -v
      - name: Restore sanitized X cooldown
        uses: actions/cache@v4
        with:
          path: private/x-state
          key: fintimes-x-health-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fintimes-x-health-
      - name: Collect X and dated official research leads
        working-directory: private
        env:
          GEMSEARCH_INBOX_JSON: ${{ github.workspace }}/gemsearch-intake/inbox/gemsearch-latest.json
          X_COLLECTION_BACKEND: twscrape
          X_SCRAPER_COOKIES: ${{ secrets.X_SCRAPER_COOKIES }}
          X_SCRAPER_HEALTH_PATH: x-state/health.json
          TWS_TELEMETRY: '0'
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_AUTHORIZED_FEED_URL: ${{ secrets.X_AUTHORIZED_FEED_URL }}
          X_FREE_READ_ENTITLEMENT: ${{ vars.X_FREE_READ_ENTITLEMENT }}
          X_PROVIDER_ZERO_COST_CONFIRMED: ${{ vars.X_PROVIDER_ZERO_COST_CONFIRMED }}
        run: |
          python -m fintimes_v4.newsroom discover
          python -m fintimes_v4.newsroom report --output output/newsroom.json
      - name: Save research coverage and source health
        uses: actions/upload-artifact@v4
        with:
          name: fintimes-v4-research-${{ github.run_id }}
          path: private/output/newsroom.json
          retention-days: 7
      - name: Remove private source and transient research
        if: always()
        run: |
          find private -mindepth 1 -maxdepth 1 ! -name x-state -exec rm -rf -- {} +
          rm -rf gemsearch-intake
  verify-pilot:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'verify-private-pilot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nitutravels/fintimesnews-automation
          ref: f710bf71f3f04df14926f73553e56b10d4b239e2
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth Pillow
      - name: Confirm private visibility and completed processing
        working-directory: private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m fintimes_v4.verify_upload L6fbRY9ScC8
      - uses: actions/upload-artifact@v4
        with:
          name: fintimes-v4-verified-pilot
          path: private/output/verified_upload.json
          retention-days: 7
      - if: always()
        run: rm -rf private

